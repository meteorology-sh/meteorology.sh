AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Mail for meteorology.sh. SES receives mail for the lab's addresses, stores it in S3, and
  a Lambda forwards it to a personal inbox. Replies go out through SES SMTP, through a
  configuration set that publishes every bounce and complaint to SNS and to the inbox.

Parameters:
  Domain:
    Type: String
    Default: meteorology.sh
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Default: Z0202560SZO07XGZ5YOJ
  SendAddress:
    Type: String
    Description: Address the SMTP login may send as. mail.sh passes it from infra/.env.
  ForwardAddress:
    Type: String
    Description: From address on forwarded mail. mail.sh passes it from infra/.env.
  DmarcAddress:
    Type: String
    Description: Address that receives DMARC aggregate reports. mail.sh passes it from infra/.env.
  ForwardTo:
    Type: String
    Description: Inbox that receives the forwarded mail. mail.sh passes it from infra/.env.

Resources:
  # Sending identity: Easy DKIM plus a custom MAIL FROM so SPF and DKIM both align.
  #
  # ConfigurationSetAttributes makes the set the identity default. Gmail cannot add an
  # X-SES-CONFIGURATION-SET header, so without this every SMTP send would bypass the set
  # and its event publishing.
  DomainIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref Domain
      ConfigurationSetAttributes:
        ConfigurationSetName: !Ref ConfigSet
      MailFromAttributes:
        MailFromDomain: !Sub mail.${Domain}
        BehaviorOnMxFailure: USE_DEFAULT_VALUE

  # Everything the domain sends flows through here, so bounces and complaints have one
  # place to arrive from and reputation metrics have one place to be read.
  ConfigSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Sub ${AWS::StackName}-sending
      ReputationOptions:
        ReputationMetricsEnabled: true
      SendingOptions:
        SendingEnabled: true
      SuppressionOptions:
        SuppressedReasons: [BOUNCE, COMPLAINT]

  # The problem events only. Delivery is left out on purpose: a notification for every
  # successful send is noise, and noise is how a monitored inbox stops being read.
  ConfigSetEvents:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref ConfigSet
      EventDestination:
        Name: feedback
        Enabled: true
        MatchingEventTypes: [bounce, complaint, reject, deliveryDelay, renderingFailure]
        SnsDestination:
          TopicARN: !Ref FeedbackTopic

  # Bounces, complaints, and both reputation alarms land here, and the inbox is subscribed,
  # so the process runs whether or not anyone opens the console.
  FeedbackTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: meteorology.sh mail

  FeedbackSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref FeedbackTopic
      Protocol: email
      Endpoint: !Ref ForwardTo

  FeedbackTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref FeedbackTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # SNS rejects a topic policy whose statements have no Sid.
          - Sid: SesEvents
            Effect: Allow
            Principal: { Service: ses.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref FeedbackTopic
            Condition:
              StringEquals: { "AWS:SourceAccount": !Ref AWS::AccountId }
          - Sid: CloudWatchAlarms
            Effect: Allow
            Principal: { Service: cloudwatch.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref FeedbackTopic
            Condition:
              StringEquals: { "AWS:SourceAccount": !Ref AWS::AccountId }

  # 5% and 0.1% are the thresholds SES itself reviews and suspends accounts at. The metrics
  # only exist once the account has sent, so missing data is not a breach.
  BounceRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-bounce-rate
      AlarmDescription: SES account bounce rate is at the level SES reviews accounts at.
      Namespace: AWS/SES
      MetricName: Reputation.BounceRate
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0.05
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref FeedbackTopic]
      OKActions: [!Ref FeedbackTopic]

  ComplaintRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-complaint-rate
      AlarmDescription: SES account complaint rate is at the level SES reviews accounts at.
      Namespace: AWS/SES
      MetricName: Reputation.ComplaintRate
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0.001
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref FeedbackTopic]
      OKActions: [!Ref FeedbackTopic]

  # Lets the forwarder deliver while the account is in the SES sandbox.
  ForwardToIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref ForwardTo

  MailRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref Domain
          Type: MX
          TTL: "300"
          ResourceRecords: [!Sub "10 inbound-smtp.${AWS::Region}.amazonaws.com"]
        - Name: !Sub mail.${Domain}
          Type: MX
          TTL: "300"
          ResourceRecords:
            [!Sub "10 feedback-smtp.${AWS::Region}.amazonses.com"]
        - Name: !Sub mail.${Domain}
          Type: TXT
          TTL: "300"
          ResourceRecords: ['"v=spf1 include:amazonses.com ~all"']
        # p=quarantine with a reporting address. A record at p=none with no rua says
        # nobody is watching the domain, which is the opposite of what we mean.
        - Name: !Sub _dmarc.${Domain}
          Type: TXT
          TTL: "300"
          ResourceRecords:
            [!Sub '"v=DMARC1; p=quarantine; rua=mailto:${DmarcAddress}; fo=1;"']
        - Name: !GetAtt DomainIdentity.DkimDNSTokenName1
          Type: CNAME
          TTL: "300"
          ResourceRecords: [!GetAtt DomainIdentity.DkimDNSTokenValue1]
        - Name: !GetAtt DomainIdentity.DkimDNSTokenName2
          Type: CNAME
          TTL: "300"
          ResourceRecords: [!GetAtt DomainIdentity.DkimDNSTokenValue2]
        - Name: !GetAtt DomainIdentity.DkimDNSTokenName3
          Type: CNAME
          TTL: "300"
          ResourceRecords: [!GetAtt DomainIdentity.DkimDNSTokenValue3]

  InboxBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-inbox
            Status: Enabled
            ExpirationInDays: 90

  InboxBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref InboxBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: ses.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub ${InboxBucket.Arn}/*
            Condition:
              StringEquals: { "AWS:SourceAccount": !Ref AWS::AccountId }

  ForwarderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: forward
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${InboxBucket.Arn}/*
              - Effect: Allow
                Action: ses:SendRawEmail
                Resource: "*"

  Forwarder:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt ForwarderRole.Arn
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          BUCKET: !Ref InboxBucket
          PREFIX: inbox/
          # Gmail treats mail from one of your own send-as addresses as mail you sent,
          # and replies to it from your default address. Forwards come from ForwardAddress.
          FROM: !Ref ForwardAddress
          SITE: !Ref Domain
          TO: !Ref ForwardTo
      Code:
        ZipFile: |
          const { S3Client, GetObjectCommand } = require("@aws-sdk/client-s3");
          const { SESv2Client, SendEmailCommand } = require("@aws-sdk/client-sesv2");
          const s3 = new S3Client();
          const ses = new SESv2Client();
          const { BUCKET, PREFIX, FROM, TO, SITE } = process.env;

          // Headers that break or lie once the message is re-sent from our domain.
          const DROP = /^(from|reply-to|sender|return-path|message-id|dkim-signature|domainkey-signature|arc-[\w-]+|authentication-results|received-spf|x-ses-[\w-]+)$/i;

          exports.handler = async (event) => {
            const { mail, receipt } = event.Records[0].ses;
            if (receipt.spamVerdict.status === "FAIL" || receipt.virusVerdict.status === "FAIL") {
              console.log("dropped", mail.messageId, receipt.spamVerdict.status, receipt.virusVerdict.status);
              return;
            }

            const object = await s3.send(new GetObjectCommand({ Bucket: BUCKET, Key: PREFIX + mail.messageId }));
            const raw = Buffer.from(await object.Body.transformToByteArray()).toString("latin1");
            const split = raw.search(/\r?\n\r?\n/);
            const headers = raw.slice(0, split).split(/\r?\n(?![ \t])/);
            const body = raw.slice(split);

            const header = (name) => {
              const line = headers.find((h) => h.toLowerCase().startsWith(name + ":"));
              return line && line.slice(name.length + 1).replace(/\r?\n[ \t]+/g, " ").trim();
            };
            const from = header("from") || mail.source;
            const replyTo = header("reply-to") || from;
            const name = (from.match(/^(.*?)\s*<[^>]*>\s*$/)?.[1] || from).replace(/^"|"$/g, "").trim();
            const display = /=\?/.test(name) ? `${name} "via ${SITE}"` : `"${name.replace(/["\\]/g, "")} via ${SITE}"`;

            const kept = headers.filter((h) => !DROP.test(h.slice(0, h.indexOf(":")).trim()));
            kept.unshift(`From: ${display} <${FROM}>`, `Reply-To: ${replyTo}`);

            await ses.send(new SendEmailCommand({
              FromEmailAddress: FROM,
              Destination: { ToAddresses: [TO] },
              Content: { Raw: { Data: Buffer.from(kept.join("\r\n") + body, "latin1") } },
            }));
            console.log("forwarded", mail.messageId);
          };

  ForwarderPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Forwarder
      Action: lambda:InvokeFunction
      Principal: ses.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  RuleSet:
    Type: AWS::SES::ReceiptRuleSet
    Properties:
      RuleSetName: meteorology-sh

  ForwardRule:
    Type: AWS::SES::ReceiptRule
    DependsOn: [InboxBucketPolicy, ForwarderPermission]
    Properties:
      RuleSetName: !Ref RuleSet
      Rule:
        Name: forward
        Enabled: true
        ScanEnabled: true
        TlsPolicy: Optional
        # hello@ was added to the live rule outside the stack. Naming every address here
        # keeps a deploy from removing it. DmarcAddress is on the rule because the DMARC
        # record's rua points at it, and a reporting address that bounces is worse than none.
        Recipients:
          - !Sub "hello@${Domain}"
          - !Ref SendAddress
          - !Ref DmarcAddress
        Actions:
          - S3Action:
              BucketName: !Ref InboxBucket
              ObjectKeyPrefix: inbox/
          - LambdaAction:
              FunctionArn: !GetAtt Forwarder.Arn
              InvocationType: Event

  # SMTP login for Gmail "Send mail as". It may only send as the one address.
  SmtpUser:
    Type: AWS::IAM::User
    Properties:
      UserName: meteorology-sh-smtp
      Policies:
        - PolicyName: send-as
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: ses:SendRawEmail
                Resource: "*"
                Condition:
                  StringEquals:
                    { "ses:FromAddress": !Ref SendAddress }

Outputs:
  RuleSetName:
    Value: !Ref RuleSet
  InboxBucket:
    Value: !Ref InboxBucket
  SmtpUser:
    Value: !Ref SmtpUser
  ConfigSet:
    Value: !Ref ConfigSet
  FeedbackTopic:
    Value: !Ref FeedbackTopic
